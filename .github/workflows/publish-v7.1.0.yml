name: Publish Production Site Autopilot v7.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v7.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-site-autopilot-v7.1.0-publish
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: v7.1.0
      USER_ARCHIVE: production-site-autopilot-codex-user-v7.1.0.zip
      ENGINEERING_ARCHIVE: production-site-autopilot-codex-engineering-v7.1.0.zip
      USER_SHA256: 90a118d52020b2307c8447ea81ad6cd520492d255a274440adaa0cf03d257886
      ENGINEERING_SHA256: 97666e9ba94e41a7c4cd103d3023bf1fd7c243f15ef43dec96fa45822dfaaac6

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Retrieve immutable source fragments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidates"
          SHAS=(
            3a318da9023193167c5075aed49d2b4462f863c6
            f450e781dcfc5933e63c6702c308e2e2c8c611a3
            957a87ba016d448f40282ef484d1a8faae1448d0
            831f1c38f42bd149ec1359d2cba22b989f8023fb
          )
          index=0
          for sha in "${SHAS[@]}"; do
            gh api "repos/ub3dqy/codex-plugin-cc/git/blobs/$sha" --jq .content \
              | tr -d '\n' \
              | base64 --decode \
              > "$RUNNER_TEMP/candidates/part-$index"
            index=$((index + 1))
          done

      - name: Resolve fragment order and safely extract engineering source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import itertools
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          temp = Path(os.environ["RUNNER_TEMP"])
          parts = [p.read_text(encoding="ascii").strip() for p in sorted((temp / "candidates").glob("part-*"))]
          destination = temp / "engineering-unpack"
          destination.mkdir(parents=True, exist_ok=True)
          expected_marker = "production-site-autopilot-codex-engineering-v7.1.0/VERSION"

          selected = None
          for order in itertools.permutations(range(len(parts))):
              combined = "".join(parts[index] for index in order)
              try:
                  payload = base64.b64decode(combined, validate=True)
              except Exception:
                  continue
              if not payload.startswith(b"\xfd7zXZ\x00"):
                  continue
              try:
                  with tarfile.open(fileobj=io.BytesIO(payload), mode="r:xz") as handle:
                      members = handle.getmembers()
                      names = [member.name.lstrip("./") for member in members]
                      if not any(name.endswith(expected_marker) for name in names):
                          continue
                      for member in members:
                          path = PurePosixPath(member.name)
                          if path.is_absolute() or ".." in path.parts:
                              raise SystemExit(f"unsafe archive path: {member.name}")
                          if member.issym() or member.islnk():
                              raise SystemExit(f"archive links are not allowed: {member.name}")
                      handle.extractall(destination)
              except (tarfile.TarError, EOFError, OSError):
                  continue
              selected = (order, payload)
              break

          if selected is None:
              raise SystemExit("unable to reconstruct the verified engineering source transport")

          order, payload = selected
          transport = temp / "production-site-source-v7.1.0.tar.xz"
          transport.write_bytes(payload)
          print("fragment order:", order)
          print("transport sha256:", hashlib.sha256(payload).hexdigest())
          PY
          ENGINEERING_ROOT="$(find "$RUNNER_TEMP/engineering-unpack" -type f -path '*/production-site-autopilot-codex-engineering-v7.1.0/VERSION' -printf '%h\n' | head -1)"
          test -n "$ENGINEERING_ROOT"
          test "$(cat "$ENGINEERING_ROOT/VERSION")" = "7.1.0"
          echo "ENGINEERING_ROOT=$ENGINEERING_ROOT" >> "$GITHUB_ENV"

      - name: Run deterministic release checks
        working-directory: ${{ env.ENGINEERING_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_release_checks.py --package-root . --skip-live

      - name: Build and verify both editions
        working-directory: ${{ env.ENGINEERING_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          python scripts/build_user_release.py --package-root . --output-dir "$RUNNER_TEMP/dist"
          python scripts/verify_user_release.py --archive "$RUNNER_TEMP/dist/$USER_ARCHIVE"
          printf '%s  %s\n' "$USER_SHA256" "$RUNNER_TEMP/dist/$USER_ARCHIVE" | sha256sum --check --strict

          python scripts/build_release.py --package-root . --output "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE" --skip-checks
          python scripts/verify_release.py --archive "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"
          printf '%s  %s\n' "$ENGINEERING_SHA256" "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE" | sha256sum --check --strict
          unzip -t "$RUNNER_TEMP/dist/$USER_ARCHIVE"
          unzip -t "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"

      - name: Safely extract user edition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "dist" / os.environ["USER_ARCHIVE"]
          destination = Path(os.environ["RUNNER_TEMP"]) / "user-unzip"
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe ZIP path: {info.filename}")
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"ZIP links are not allowed: {info.filename}")
              zf.extractall(destination)
          PY
          USER_ROOT="$RUNNER_TEMP/user-unzip/production-site-autopilot-codex-user-v7.1.0"
          test -f "$USER_ROOT/README.md"
          echo "USER_ROOT=$USER_ROOT" >> "$GITHUB_ENV"

      - name: Publish browsable source to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf user engineering
          mkdir -p user engineering
          cp -a "$USER_ROOT"/. user/
          cp -a "$ENGINEERING_ROOT"/. engineering/
          cp engineering/CHANGELOG.md CHANGELOG.md
          (
            cd "$RUNNER_TEMP/dist"
            sha256sum "$USER_ARCHIVE" "$ENGINEERING_ARCHIVE"
          ) > SHA256SUMS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "publish: Production Site Autopilot v7.1.0 editions"
            git push origin HEAD:main
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(
            "$RUNNER_TEMP/dist/$USER_ARCHIVE"
            "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"
            "SHA256SUMS"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Production Site Autopilot for OpenAI Codex v7.1.0" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Production Site Autopilot for OpenAI Codex v7.1.0" --notes-file RELEASE_NOTES.md
          fi
