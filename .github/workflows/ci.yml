name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run deterministic suite
        shell: bash
        env:
          PYTHONPATH: src
        run: python scripts/run_checks.py
      - name: Native Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows_smoke.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            build/test-evidence.json
            evidence/windows-native.json
          if-no-files-found: warn
