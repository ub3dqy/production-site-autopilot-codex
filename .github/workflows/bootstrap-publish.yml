name: Bootstrap and publish Production Site Autopilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-site-autopilot-bootstrap-v7.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: "7.1.0"
      TAG: "v7.1.0"
      USER_ARCHIVE: "production-site-autopilot-codex-user-v7.1.0.zip"
      ENGINEERING_ARCHIVE: "production-site-autopilot-codex-engineering-v7.1.0.zip"
      USER_SHA256: "90a118d52020b2307c8447ea81ad6cd520492d255a274440adaa0cf03d257886"
      ENGINEERING_SHA256: "97666e9ba94e41a7c4cd103d3023bf1fd7c243f15ef43dec96fa45822dfaaac6"
      TRANSPORT_SHA256: "0641fa4096e4052c3af2deddb5d74a9d395180d43078210eeaf1de33c6633b14"
      TRANSPORT_COMMIT: "8a7006a41391e1a5aac39631683ba09e5ec64cdc"

    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reconstruct verified engineering source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/transport"
          : > "$RUNNER_TEMP/transport/source.b64"
          for part in $(seq -w 0 19); do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/ub3dqy/codex-plugin-cc/${TRANSPORT_COMMIT}/production-site-autopilot-codex/.release-payload/v7.1.0/source/part-${part}" \
              >> "$RUNNER_TEMP/transport/source.b64"
          done
          base64 --decode "$RUNNER_TEMP/transport/source.b64" \
            > "$RUNNER_TEMP/transport/source.tar.xz"
          printf '%s  %s\n' "$TRANSPORT_SHA256" "$RUNNER_TEMP/transport/source.tar.xz" \
            | sha256sum --check --strict

      - name: Safely extract engineering source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engineering"
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "transport" / "source.tar.xz"
          destination = Path(os.environ["RUNNER_TEMP"]) / "engineering"
          with tarfile.open(archive, "r:xz") as handle:
              for member in handle.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"archive links are not allowed: {member.name}")
              handle.extractall(destination)
          PY
          SOURCE_ROOT="$RUNNER_TEMP/engineering/production-site-autopilot-codex-engineering-v7.1.0"
          test -f "$SOURCE_ROOT/VERSION"
          test "$(cat "$SOURCE_ROOT/VERSION")" = "$VERSION"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Run deterministic engineering checks
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_release_checks.py --package-root . --skip-live

      - name: Rebuild and verify both editions
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          python scripts/build_user_release.py --package-root . --output-dir "$RUNNER_TEMP/dist"
          python scripts/verify_user_release.py --archive "$RUNNER_TEMP/dist/$USER_ARCHIVE"
          python scripts/build_release.py \
            --package-root . \
            --output "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE" \
            --skip-checks
          python scripts/verify_release.py --archive "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"
          printf '%s  %s\n' "$USER_SHA256" "$RUNNER_TEMP/dist/$USER_ARCHIVE" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$ENGINEERING_SHA256" "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE" \
            | sha256sum --check --strict
          unzip -t "$RUNNER_TEMP/dist/$USER_ARCHIVE"
          unzip -t "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"

      - name: Prepare clean public repository tree
        shell: bash
        run: |
          set -euo pipefail
          USER_EXTRACT="$RUNNER_TEMP/user-extract"
          PUBLISH_DIR="$RUNNER_TEMP/publish"
          mkdir -p "$USER_EXTRACT" "$PUBLISH_DIR/user" "$PUBLISH_DIR/engineering" "$PUBLISH_DIR/.github/workflows"
          unzip -q "$RUNNER_TEMP/dist/$USER_ARCHIVE" -d "$USER_EXTRACT"
          USER_ROOT="$USER_EXTRACT/production-site-autopilot-codex-user-v7.1.0"
          test -f "$USER_ROOT/README.md"
          cp -a "$USER_ROOT"/. "$PUBLISH_DIR/user/"
          cp -a "$SOURCE_ROOT"/. "$PUBLISH_DIR/engineering/"

          cat > "$PUBLISH_DIR/README.md" <<'EOF'
          # Production Site Autopilot for OpenAI Codex

          Production Site Autopilot takes a website project from preflight to a validated production checkpoint: it detects the stack and project state, selects the safest execution mode, audits the existing implementation, applies reversible fixes, runs build/tests/validators, and writes one final evidence report.

          ## Two editions

          - [`user/`](./user/) — simplified edition for everyday use, with a single launcher and automatic mode/stack selection.
          - [`engineering/`](./engineering/) — complete source, contracts, gates, artifact routes, validators, tests, installers, and reproducible release tooling.

          ## Quick start on Windows

          1. Download the User Edition from the latest release.
          2. Extract the ZIP.
          3. Run `START_SITE_AUTOPILOT_WINDOWS.cmd`.
          4. Select the website or project directory.

          After installation, open any project in Codex and write:

          ```text
          Доведи этот сайт до production.
          ```

          Audit-only example:

          ```text
          Проведи полный аудит сайта, ничего не изменяй и выдай итоговый отчёт.
          ```

          ## Safety

          The Autopilot does not silently change URLs or domains, delete pages or data, publish unverified claims, enable tracking, buy paid services, push changes, or deploy to production. It continues all safe work and asks at most one consolidated blocker question when an owner decision is genuinely required.

          ## Verification status

          - Artifact coverage: 80/80 PASS.
          - Configuration scenarios: 18/18 PASS.
          - Validator regression tests: 14/14 PASS.
          - Autopilot deterministic tests: 9/9 PASS.
          - UX and lifecycle checks: 36/36 PASS.
          - Package verification and reproducible builds: PASS.
          - Live autonomous Codex behavior: `NOT_RUN` in the original build environment.
          - Native Windows runtime execution: `NOT_RUN` in the original Linux build environment.

          See [`engineering/SELF_TEST_REPORT.md`](./engineering/SELF_TEST_REPORT.md) for details.
          EOF

          cat > "$PUBLISH_DIR/LICENSE.md" <<'EOF'
          # Licensing notice

          Copyright © 2026 ub3dqy. All rights reserved.

          The files in this repository are publicly available for inspection and use by the copyright holder. No permission to copy, modify, redistribute, sublicense, or sell these files is granted unless a separate written license is provided.
          EOF

          if test -f "$SOURCE_ROOT/CHANGELOG.md"; then
            cp "$SOURCE_ROOT/CHANGELOG.md" "$PUBLISH_DIR/CHANGELOG.md"
          fi
          cat > "$PUBLISH_DIR/RELEASE_NOTES.md" <<'EOF'
          # Production Site Autopilot for Codex v7.1.0

          This release contains two editions built from one canonical engineering source tree.

          - User Edition: one launcher, zero-config project detection, automatic mode/stack selection, implementation, validation, and one final report.
          - Engineering Edition: complete contracts, gates, artifact routing, validators, tests, lifecycle tooling, and reproducible release builders.

          Deterministic tests and package verification passed. Live autonomous Codex behavior and native Windows runtime execution remain `NOT_RUN` and are not represented as PASS.
          EOF
          printf '%s  %s\n' "$USER_SHA256" "$USER_ARCHIVE" > "$PUBLISH_DIR/SHA256SUMS"
          printf '%s  %s\n' "$ENGINEERING_SHA256" "$ENGINEERING_ARCHIVE" >> "$PUBLISH_DIR/SHA256SUMS"
          printf 'dist/\n__pycache__/\n*.pyc\n*.pyo\n' > "$PUBLISH_DIR/.gitignore"

          cat > "$PUBLISH_DIR/.github/workflows/ci.yml" <<'EOF'
          name: Production Site Autopilot CI

          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 50
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - name: Run deterministic checks
                  working-directory: engineering
                  run: python scripts/run_release_checks.py --package-root . --skip-live
                - name: Build and verify User Edition
                  working-directory: engineering
                  run: |
                    rm -rf dist
                    python scripts/build_user_release.py --package-root . --output-dir dist
                    python scripts/verify_user_release.py --archive dist/production-site-autopilot-codex-user-v7.1.0.zip
                    echo '90a118d52020b2307c8447ea81ad6cd520492d255a274440adaa0cf03d257886  dist/production-site-autopilot-codex-user-v7.1.0.zip' | sha256sum --check --strict
                - name: Build and verify Engineering Edition
                  working-directory: engineering
                  run: |
                    python scripts/build_release.py --package-root . --output dist/production-site-autopilot-codex-engineering-v7.1.0.zip --skip-checks
                    python scripts/verify_release.py --archive dist/production-site-autopilot-codex-engineering-v7.1.0.zip
                    echo '97666e9ba94e41a7c4cd103d3023bf1fd7c243f15ef43dec96fa45822dfaaac6  dist/production-site-autopilot-codex-engineering-v7.1.0.zip' | sha256sum --check --strict
          EOF
          echo "PUBLISH_DIR=$PUBLISH_DIR" >> "$GITHUB_ENV"

      - name: Replace main with the clean project tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$PUBLISH_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Production Site Autopilot for Codex v7.1.0"
          git branch -M main
          PUBLISH_SHA="$(git rev-parse HEAD)"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/main
          echo "PUBLISH_SHA=$PUBLISH_SHA" >> "$GITHUB_ENV"

      - name: Create or update public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(
            "$RUNNER_TEMP/dist/$USER_ARCHIVE"
            "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"
            "$PUBLISH_DIR/SHA256SUMS"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Production Site Autopilot for Codex v7.1.0" \
              --notes-file "$PUBLISH_DIR/RELEASE_NOTES.md"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$PUBLISH_SHA" \
              --title "Production Site Autopilot for Codex v7.1.0" \
              --notes-file "$PUBLISH_DIR/RELEASE_NOTES.md"
          fi
