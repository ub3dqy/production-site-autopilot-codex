name: Materialize browsable source

on:
  push:
    branches:
      - codex/remediate-v7.2.0
    paths:
      - .github/workflows/materialize-source.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-source.yml
      - prepare_editions.py
      - packages/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materialize-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify and materialize embedded source
        run: |
          set -euo pipefail
          python prepare_editions.py
          test -f user/README.md
          test -f engineering/README.md
          tar -czf materialized-editions.tar.gz user engineering

      - name: Upload materialized editions
        uses: actions/upload-artifact@v4
        with:
          name: materialized-editions
          path: materialized-editions.tar.gz
          if-no-files-found: error
          retention-days: 7
