name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify deterministic suite
        shell: bash
        env:
          PYTHONPATH: src
        run: python scripts/run_checks.py

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native Windows lifecycle
        shell: pwsh
        run: ./scripts/windows_smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-evidence
          path: evidence/windows-native.json
          if-no-files-found: error

  build:
    needs: [deterministic, windows-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-evidence
          path: evidence
      - name: Match tag and version
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build deterministic artifacts
        env:
          PYTHONPATH: src
        run: python scripts/build_release.py
      - name: Attest archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Production Site Autopilot $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
